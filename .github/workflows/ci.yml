name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Lint (ruff)
        run: ruff check backend

      - name: Format check (black)
        run: black --check backend

      - name: Type check (mypy)
        run: mypy backend --ignore-missing-imports || true # advisory, not blocking (see README)

      - name: Unit + integration + agent tests
        env:
          LLM_PROVIDER: mock
          DATABASE_URL: "sqlite:///:memory:"
        run: pytest backend/tests -q --cov=backend --cov-report=term-missing

      - name: Agent evaluation (non-blocking metrics report)
        env:
          LLM_PROVIDER: mock
        run: python -m backend.evaluation.run_eval

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t ai-food-concierge-backend:ci .

      - name: Build frontend image
        run: docker build -f frontend/Dockerfile -t ai-food-concierge-frontend:ci .
